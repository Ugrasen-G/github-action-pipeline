Yaml
name: Terraform Azure Deployment

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout\@v4

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login\@v2
        with:
          client-id : "7ca4ffc0-f0d3-4549-a667-fec891af8a53"
          tenant-id: "79770134-1424-49a1-8c6f-62f3d6621777"
          subscription-id: "a954f93d-4fb9-4f5d-bd67-4d4dd65ad6d8"

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform\@v3

      # 4. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 5. Terraform Format Check
      - name: Terraform Format
        run: terraform fmt -check

      # 6. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 7. Terraform Plan
      - name: Terraform Plan
        run: terraform plan

