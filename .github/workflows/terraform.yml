# name: Terraform Azure Infra Deployment pipeline

# on:
#   push:
#     branches: [ "feature/*" ]

#   pull_request:
#     branches: [ "main" ]

on:
  push:
    branches:
      - main
      - "feature/**"


permissions:
  id-token: write
  contents: read
  pull-requests: write
  
jobs:
  # terraform:
  #   environments: dev

  lint-and-scan:
    name: 'Lint and Security Scan'
    runs-on: ubuntu-latest
    
        
    steps:

      # 1. checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Setup TfLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      # 4. Run TFLint
      - name: Run TFLint
        run: |
         tflint --init
         tflint -f compact

      # 5. Run tfsec
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}

      # 6. Run checkov
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true

  
  terraform-init-plan:
    name: Terraform Init and Validate and plan
    needs: lint-and-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environments/dev

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4  

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  

      # 4. Terraform Init
      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }}

      # 5. Terraform Validate
      - name: Terraform Validate
        run: terraform validate   
      
      # 6. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_LOG: INFO  
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }}    
      
         
      - name: Install Infracost
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

      - name: Estimate Infrastructure Cost
        working-directory: ./terraform
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path tfplan

      
      - name: Check Azure CLI
        run: |
          az version
          az extension list --output table

      - name: Install Cost Management Extension
        run: |
          az extension add --name costmanagement --upgrade
          az costmanagement --help

      - name: Azure Infrastructure Cost - Last 30 Days
        working-directory: ./environments/dev
        shell: bash
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          FROM_DATE=$(date -u -d '30 days ago' +%Y-%m-%d)
          TO_DATE=$(date -u +%Y-%m-%d)

          BODY=$(jq -n \
            --arg from "$FROM_DATE" \
            --arg to "$TO_DATE" \
            '{
             type: "ActualCost",
             timeframe: "Custom",
             timePeriod: {
               from: ($from + "T00:00:00Z"),
               to: ($to + "T00:00:00Z")
             },
             dataset: {
             granularity: "None",
             aggregation: {
               totalCost: {
                 name: "Cost",
                 function: "Sum"
                }
              }
            }
          }')

          az rest \
            --method post \
            --url "https://management.azure.com/subscriptions/${SUB_ID}/providers/Microsoft.CostManagement/query?api-version=2023-11-01" \
            --body "$BODY" \
            --output json



  terraform-apply:
    name: Terraform apply
    needs: terraform-init-plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environments/dev

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4    

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
           
      # 4. Terraform Init
      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }}   
          
      # 5. Terraform Plan
      - name: Terraform Plan
        if: github.ref == 'refs/heads/main'
        run: terraform plan -input=false -out=tfplan
        env:
          TF_LOG: INFO  
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }}    

      # 6. Terraform apply
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_LOG: INFO  
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }}


  terraform-destroy:
    name: Terraform Destroy
    needs: terraform-apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environments/dev

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4    

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3  
        
      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  

      # 4. Terraform Init
      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }}     
      
      # 5. Terraform Destroy Plan
      - name: Terraform Destroy Plan
        if: github.ref == 'refs/heads/main'
        run: terraform plan -destroy -input=false -out=tfplan-destroy
        env:
          TF_LOG: INFO
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }}      
 
      # 6. Terraform Destroy
      - name: Terraform Destroy
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan-destroy
        env:
          TF_LOG: INFO 
          TF_VAR_vm_username: ${{ secrets.TF_VAR_VM_USERNAME }}
          TF_VAR_vm_password: ${{ secrets.TF_VAR_VM_PASSWORD }} 
     